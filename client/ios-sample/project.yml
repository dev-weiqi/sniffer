name: SnifferIOSSample
options:
  bundleIdPrefix: dev.weiqi.sniffer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  SnifferKit:
    path: ../..
targets:
  SnifferIOSSample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SnifferKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.weiqi.sniffer.iossample
        PRODUCT_NAME: SnifferIOSSample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sniffer iOS Sample
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
schemes:
  SnifferIOSSample:
    build:
      targets:
        SnifferIOSSample: all
    run:
      config: Debug
